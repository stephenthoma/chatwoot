# Chatwoot development environment blueprint (Devin blueprint format, used by Type).
# Verified in a Type sandbox (Debian 13 trixie, x86_64) on 2026-11-11.
initialize:
  - name: System packages (PostgreSQL 17 + pgvector, Redis, libvips, build deps)
    run: |
      set -euo pipefail
      sudo apt-get update -qq
      sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
        build-essential git curl openssl libssl-dev libffi-dev libyaml-dev zlib1g-dev libreadline-dev \
        libpq-dev postgresql-17 postgresql-17-pgvector redis-server libvips42t64 imagemagick
  - name: Ruby 3.4.4 via rbenv (matches .ruby-version)
    run: |
      set -euo pipefail
      [ -d "$HOME/.rbenv" ] || git clone -q --depth 1 https://github.com/rbenv/rbenv.git "$HOME/.rbenv"
      [ -d "$HOME/.rbenv/plugins/ruby-build" ] || git clone -q --depth 1 https://github.com/rbenv/ruby-build.git "$HOME/.rbenv/plugins/ruby-build"
      git -C "$HOME/.rbenv/plugins/ruby-build" pull -q || true
      export PATH="$HOME/.rbenv/bin:$PATH"
      eval "$(rbenv init - bash)"
      RUBY_CONFIGURE_OPTS="--disable-install-doc" rbenv install -s 3.4.4
      rbenv global 3.4.4
      gem install bundler -v 2.5.16 --conservative --no-document
  - name: Node 24.22.1 via nvm (matches .nvmrc) and pnpm 10.2.0 via corepack
    run: |
      set -euo pipefail
      export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
      if [ -s /usr/local/share/nvm/nvm.sh ]; then export NVM_DIR=/usr/local/share/nvm; fi
      if [ ! -s "$NVM_DIR/nvm.sh" ]; then
        curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
      fi
      . "$NVM_DIR/nvm.sh"
      nvm install 24.22.1
      corepack enable
      corepack prepare pnpm@10.2.0 --activate
  - name: Helper scripts in $HOME/.local/bin
    run: |
      set -euo pipefail
      mkdir -p "$HOME/.local/bin"
      cat > "$HOME/.local/bin/chatwoot-env" <<'SH'
      # Source me: rbenv Ruby 3.4.4, nvm Node 24.22.1, helper PATH.
      export PATH="$HOME/.rbenv/bin:$HOME/.local/bin:$PATH"
      eval "$(rbenv init - bash)"
      if [ -z "${NVM_DIR:-}" ]; then
        if [ -s /usr/local/share/nvm/nvm.sh ]; then NVM_DIR=/usr/local/share/nvm; else NVM_DIR="$HOME/.nvm"; fi
      fi
      export NVM_DIR
      . "$NVM_DIR/nvm.sh" >/dev/null
      nvm use 24.22.1 >/dev/null
      export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      # Local, non-secret development config (no .env file needed; the development
      # secret_key_base is committed in config/secrets.yml). Exported values win over any .env.
      export RAILS_ENV=development
      export FRONTEND_URL=http://127.0.0.1:3000
      export REDIS_URL=redis://127.0.0.1:6379
      export POSTGRES_HOST=127.0.0.1
      export POSTGRES_USERNAME=chatwoot
      export POSTGRES_PASSWORD=chatwoot
      export ACTIVE_STORAGE_SERVICE=local
      export ENABLE_ACCOUNT_SIGNUP=false
      SH
      cat > "$HOME/.local/bin/chatwoot-services" <<'SH'
      #!/usr/bin/env bash
      # Start isolated local Postgres 17 + Redis on 127.0.0.1 (idempotent; no systemd needed).
      set -euo pipefail
      if ! pg_isready -h 127.0.0.1 -p 5432 -q; then
        sudo pg_ctlcluster 17 main start || true
      fi
      timeout 60 sh -c 'until pg_isready -h 127.0.0.1 -p 5432 -q; do sleep 1; done'
      if ! redis-cli -h 127.0.0.1 ping >/dev/null 2>&1; then
        mkdir -p "$HOME/.local/share/chatwoot-redis"
        redis-server --daemonize yes --bind 127.0.0.1 --port 6379 --dir "$HOME/.local/share/chatwoot-redis"
      fi
      timeout 30 sh -c 'until redis-cli -h 127.0.0.1 ping >/dev/null 2>&1; do sleep 1; done'
      SH
      cat > "$HOME/.local/bin/chatwoot-preview-frame" <<'SH'
      #!/usr/bin/env bash
      # Let Type's preview pane embed the dev app: Rails sends X-Frame-Options: SAMEORIGIN by default,
      # which blocks the cross-origin preview iframe. Writes a development-only initializer that is
      # git-excluded (never committed) and is a no-op outside RAILS_ENV=development.
      set -euo pipefail
      f=config/initializers/zz_type_preview_frame.rb
      cat > "$f" <<'RB'
      # frozen_string_literal: true

      # Generated by $HOME/.local/bin/chatwoot-preview-frame for Type preview sandboxes only (git-excluded).
      # Allows the development app to render inside Type's preview iframe.
      Rails.application.config.action_dispatch.default_headers.delete('X-Frame-Options') if Rails.env.development?
      RB
      exclude="$(git rev-parse --git-path info/exclude)"
      mkdir -p "$(dirname "$exclude")"
      grep -qxF "/$f" "$exclude" 2>/dev/null || echo "/$f" >> "$exclude"
      SH
      cat > "$HOME/.local/bin/chatwoot-db-prepare" <<'SH'
      #!/usr/bin/env bash
      # Create/seed or migrate the local dev DB only when needed. db:migrate always re-dumps
      # db/schema.rb and annotaterb rewrites model headers, so skip it when nothing is pending
      # to keep the checkout clean; ANNOTATERB_SKIP_ON_DB_TASKS stops model annotation.
      set -euo pipefail
      export ANNOTATERB_SKIP_ON_DB_TASKS=1
      if ! bundle exec rails db:abort_if_pending_migrations >/dev/null 2>&1; then
        bundle exec rails db:chatwoot_prepare
      fi
      SH
      cat > "$HOME/.local/bin/chatwoot-dev" <<'SH'
      #!/usr/bin/env bash
      # Restart Chatwoot dev stack: services, migrations, Vite asset build, Sidekiq, Rails on :3000.
      # No Vite dev server: its HMR websocket cannot pass through Rails' /vite-dev proxy behind a preview URL.
      # ViteRuby autoBuild (config/vite.json) rebuilds public/vite-dev on the next request after frontend edits.
      set -euo pipefail
      REPO="${CHATWOOT_DIR:-$(git rev-parse --show-toplevel 2>/dev/null || pwd)}"
      cd "$REPO"
      . "$HOME/.local/bin/chatwoot-env"
      chatwoot-preview-frame
      chatwoot-services
      chatwoot-db-prepare
      pkill -f 'bin/vite dev' 2>/dev/null || true
      pkill -f 'sidekiq' 2>/dev/null || true
      pkill -f 'puma.*:3000' 2>/dev/null || true
      rm -f tmp/pids/server.pid
      mkdir -p log
      bin/vite build > log/vite-build.log 2>&1 || { tail -40 log/vite-build.log; exit 1; }
      nohup bundle exec sidekiq -C config/sidekiq.yml > log/sidekiq-dev.log 2>&1 &
      exec bin/rails s -b 0.0.0.0 -p 3000
      SH
      chmod +x "$HOME/.local/bin/chatwoot-services" "$HOME/.local/bin/chatwoot-preview-frame" \
        "$HOME/.local/bin/chatwoot-db-prepare" "$HOME/.local/bin/chatwoot-dev"
      if [ -n "${ENVRC:-}" ] && [ -w "${ENVRC:-/nonexistent}" ]; then
        echo 'export PATH="$HOME/.rbenv/bin:$HOME/.rbenv/shims:$HOME/.local/bin:$PATH"' >> "$ENVRC"
      fi

maintenance:
  - name: Ruby and JS dependencies
    run: |
      set -euo pipefail
      . "$HOME/.local/bin/chatwoot-env"
      bundle check >/dev/null || bundle install -j16
      pnpm install --frozen-lockfile
  - name: Local Postgres role, databases, schema and seed
    run: |
      set -euo pipefail
      . "$HOME/.local/bin/chatwoot-env"
      chatwoot-services
      sudo -u postgres psql -qc "DO \$\$BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='chatwoot') THEN CREATE ROLE chatwoot LOGIN SUPERUSER PASSWORD 'chatwoot'; END IF; END\$\$;"
      chatwoot-db-prepare

knowledge:
  - name: dev-server
    contents: |
      Start/restart everything (Postgres 17, Redis, pending migrations, Vite build, Sidekiq, Rails):
        $HOME/.local/bin/chatwoot-dev        # run from the repo root; foreground Rails on 0.0.0.0:3000
      Order: chatwoot-env (exports local config) -> chatwoot-preview-frame -> chatwoot-services (pg_ctlcluster 17 main start; redis-server --daemonize on 127.0.0.1:6379)
      -> chatwoot-db-prepare -> bin/vite build -> sidekiq (background, log/sidekiq-dev.log) -> rails s.
      Services do not survive a new sandbox; always restart with chatwoot-dev. Only port 3000 needs previewing.
      The Vite dev server (Procfile.dev `vite`) is intentionally not used: behind a preview proxy its HMR
      websocket fails and throws in the page. Assets are prebuilt to public/vite-dev and ViteRuby autoBuild
      rebuilds them on the next page load after frontend changes (first load after an edit is slower).
      Type's preview pane embeds the app in a cross-origin iframe; Rails' default X-Frame-Options: SAMEORIGIN
      blocks that. chatwoot-preview-frame writes config/initializers/zz_type_preview_frame.rb (development only,
      listed in .git/info/exclude, never committed) to drop that header. Check: curl -sI http://127.0.0.1:3000/
      must not show x-frame-options.
      Logs: log/development.log, log/vite-build.log, log/sidekiq-dev.log.
  - name: verify
    contents: |
      Bounded health checks:
        timeout 180 sh -c 'until curl -sf -o /dev/null http://127.0.0.1:3000/app/login; do sleep 2; done'
        construct check-app --base-url http://127.0.0.1:3000/app/login   # expect no problems
      Development login (seeded by db/seeds.rb on first db:chatwoot_prepare): SuperAdmin John,
      email john@acme.inc, password documented in db/seeds.rb. Account "Acme Inc" (id 1), inbox "Acme Support",
      conversation #1 with contact "jane". Super Admin console: /super_admin.
      Construct recipe that passed (save as /tmp/construct/recipe.json; run with
      CHATWOOT_DEV_EMAIL / CHATWOOT_DEV_PASSWORD exported from the seed values):
        construct --base-url http://127.0.0.1:3000/ --repo "$PWD" --steps /tmp/construct/recipe.json
      {
        "id": "chatwoot-login-reply",
        "name": "Sign in as the seeded agent and reply to a conversation",
        "outcomes": [
          { "id": "login", "description": "Seeded agent John signs in; the Acme Inc dashboard loads its inbox and conversations", "startStep": 1, "endStep": 9 },
          { "id": "reply", "description": "John's reply to Jane is sent and still shows after reload", "startStep": 10, "endStep": 18 }
        ],
        "steps": [
          { "action": "goto", "path": "/app/login" },
          { "action": "fill", "target": { "by": "label", "value": "email_address" }, "value": "{env:CHATWOOT_DEV_EMAIL}" },
          { "action": "fill", "target": { "by": "css", "value": "input[data-testid=\"password_input\"]" }, "value": "{env:CHATWOOT_DEV_PASSWORD}" },
          { "action": "click", "target": { "by": "role", "role": "button", "name": "Login" } },
          { "action": "wait-for-pathname-not-equals", "path": "/app/login", "timeoutMs": 30000 },
          { "action": "goto", "path": "/app/accounts/1/dashboard" },
          { "action": "wait-for-text", "selector": "body", "value": "Please select a conversation from left pane", "timeoutMs": 60000 },
          { "action": "wait-for-text", "selector": "body", "value": "All conversations loaded", "timeoutMs": 60000 },
          { "action": "assert-text", "selector": "body", "value": "Acme Support" },
          { "action": "goto", "path": "/app/accounts/1/conversations/1" },
          { "action": "wait-for-visible-any", "selectors": [".ProseMirror"], "timeoutMs": 60000 },
          { "action": "click", "target": { "by": "css", "value": ".ProseMirror" } },
          { "action": "fill", "target": { "by": "css", "value": ".ProseMirror" }, "value": "Hi Jane, following up on your order {run:id}" },
          { "action": "click", "target": { "by": "role", "role": "button", "name": "Send (CTRL + ↵)" } },
          { "action": "goto", "path": "/app/accounts/1/conversations/1" },
          { "action": "wait-for-text", "selector": "body", "value": "All conversations loaded", "timeoutMs": 60000 },
          { "action": "wait-for-text", "selector": "body", "value": "following up on your order {run:id}", "timeoutMs": 60000 },
          { "action": "assert-text", "selector": "body", "value": "Hi Jane, following up on your order {run:id}" }
        ]
      }
      Known app behavior (not an environment fault): in a fresh browser profile, the first SPA navigation
      right after login can stay on "Loading inboxes" (inbox/label/team cache fetch never fires). A full page
      load of /app/accounts/1/dashboard loads normally, so the recipe reloads the dashboard after sign-in and
      waits for "All conversations loaded" before asserting. Passed final run used --base-url http://127.0.0.1:3000/.
  - name: lint-test-build
    contents: |
      Source env first: . "$HOME/.local/bin/chatwoot-env"
      Ruby lint: bundle exec rubocop <files>      JS lint: pnpm exec eslint <files>
      Ruby tests: bundle exec rspec spec/path_spec.rb (uses chatwoot_test DB, created by db:chatwoot_prepare)
      JS tests: pnpm test <path>                  Asset build: bin/vite build
      Seed richer data: bundle exec rails search:setup_test_data, or Super Admin -> Accounts -> Seed.
  - name: secrets-and-config
    contents: |
      No secrets are required for the core dashboard workflow. No .env file is used: $HOME/.local/bin/chatwoot-env
      exports loopback Postgres (role chatwoot, dev-only) and Redis settings, and Rails development uses the
      secret_key_base committed in config/secrets.yml. Do not create a .env with credentials in snapshots.
      Optional integrations (SMTP, Facebook, Slack, Google OAuth, OpenAI/Captain, S3, Stripe) stay unconfigured;
      supply their variables (names in .env.example) via Type's encrypted environment storage if needed.
  - name: resource-notes
    contents: |
      Platform: Debian 13 (trixie) x86_64; packages postgresql-17, postgresql-17-pgvector (schema enables `vector`),
      libvips42t64. No systemd: Postgres is started with pg_ctlcluster, Redis with --daemonize.
      Ruby 3.4.4 build takes a few minutes; bundle install ~2 min; pnpm install ~10 s; vite build ~1-2 min.
      In development db:migrate rewrites db/schema.rb and model annotations; chatwoot-db-prepare avoids running it
      when nothing is pending. Revert unintended schema.rb/annotation diffs before committing.
      First dashboard load in dev can take ~10 s; Construct waits use up to 60 s.
